<title>Field from Above — demo (Mąkownica)</title>
<style>

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--tlo);color:var(--atrament);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{padding:26px clamp(16px,4vw,56px) 18px;background:#14251a;color:#f3f6ef;position:relative}
  header h1{margin:0 0 6px;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.02em}
  header p{margin:0;max-width:74ch;color:#c9d6c6}
  .jezyk{position:absolute;top:18px;right:clamp(16px,4vw,56px);display:flex;gap:4px}
  .jezyk button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer;
                border:1px solid #3b5a40;background:#1b2f20;color:#d9e6d4}
  .jezyk button.aktywna{background:#f3f6ef;color:#14251a;border-color:#f3f6ef}
  .znaczniki{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .znaczniki span{background:#243b28;border:1px solid #3b5a40;border-radius:999px;
                  padding:4px 10px;font-size:12.5px;color:#d9e6d4}
  main{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;
       padding:22px clamp(16px,4vw,56px) 40px;max-width:1560px;margin:0 auto}
  aside{position:sticky;top:16px;align-self:start}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--cichy);margin:0 0 8px}
  .lista{display:grid;gap:8px}
  .dzialka{text-align:left;border:1px solid var(--linia);background:var(--panel);border-radius:10px;
           padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
  .dzialka:hover{border-color:#9fb79b}
  .dzialka.aktywna{border-color:var(--ziel);background:var(--ziel-jasny);box-shadow:inset 3px 0 0 var(--ziel)}
  .dzialka b{display:block;font-size:17px}
  .dzialka small{color:var(--cichy);font-size:12.5px}
  .dzialka.brak{opacity:.85;border-style:dashed}
  section.widok{min-width:0}
  .warstwy{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .warstwa{border:1px solid var(--linia);background:var(--panel);border-radius:999px;padding:8px 14px;
           cursor:pointer;font:inherit;font-size:14px}
  .warstwa.aktywna{background:var(--ziel);border-color:var(--ziel);color:#fff}
  figure{margin:0;background:var(--panel);border:1px solid var(--linia);border-radius:14px;overflow:hidden}
  figure img{display:block;width:100%;height:auto;background:#e8e6de}
  figcaption{padding:9px 14px;font-size:13px;color:var(--cichy);border-top:1px solid var(--linia)}
  .karty{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .karta{background:var(--panel);border:1px solid var(--linia);border-radius:12px;padding:12px 14px}
  .karta .nazwa{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--cichy)}
  .karta .wartosc{font-size:23px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
  .karta .dopisek{font-size:12px;color:var(--cichy)}
  .panel{background:var(--panel);border:1px solid var(--linia);border-radius:14px;padding:16px 18px;margin:14px 0}

  .przelaczniki button{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;
                       border:1px solid var(--linia);background:#fbfbf8;cursor:pointer}
  .przelaczniki button.aktywna{background:var(--ziel);color:#fff;border-color:var(--ziel)}
  ul{margin:6px 0 0;padding-left:20px}
  li{margin:5px 0}
  .ostrzezenie{border-left:4px solid var(--ostrz);background:#fdf6ea;padding:10px 14px;border-radius:8px;
               font-size:14.5px;color:#4a3a25}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linia);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cichy)}
  td.liczba{font-variant-numeric:tabular-nums;white-space:nowrap}
  .brak-panel{display:none}
  .brak-panel.aktywny{display:block}
  .siatka2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){
    main{grid-template-columns:1fr}
    aside{position:static}
    .lista{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
    .siatka2{grid-template-columns:1fr}
  }
  footer{padding:20px clamp(16px,4vw,56px) 40px;color:var(--cichy);font-size:12.5px;
         border-top:1px solid var(--linia);max-width:1560px;margin:0 auto}
  .mono{font-family:var(--mono);font-size:.92em}
  .malo{font-size:12.5px;color:var(--cichy)}
</style>
</head>

</main>

    t("zn_nmt") + " " + m.rzezba.odczyt.slice(0,10),
    t("zn_res")

  $("zbudowano").textContent = m.zbudowano;
}

function lista(){
  const el = $("lista");
  el.innerHTML = DANE.dzialki.map(d => `
    <button class="dzialka ${d.id===stan.dzialka?"aktywna":""}" data-id="${d.id}">
      <b>${d.id}</b>
      <small>${fmt(d.powierzchnia_ha,3)} ha · NDVI ${fmt(d.stat.ndvi_srednia,2)}</small>
    </button>`).join("") + `
    <button class="dzialka brak ${stan.dzialka==="90/1"?"aktywna":""}" data-id="90/1">
      <b>90/1</b><small>${t("lista_brak")}</small>
    </button>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    stan.dzialka = b.dataset.id;
    if (stan.dzialka === "90/1") { pokazBrak(); } else { pokazDzialke(); }
    lista();
  });
}

function pokazBrak(){
  $("widok-dzialki").style.display = "none";
  $("widok-brak").classList.add("aktywny");
}

function daneDzialki(){
  return DANE.dzialki.find(d => d.id === stan.dzialka) || DANE.dzialki[0];
}

function obrazek(d, warstwa){
  if (warstwa === "przeglad") return "img/przeglad.png";
  return d.obrazy[warstwa];
}

function podpis(d, warstwa){
  const m = DANE.meta;
  if (warstwa === "przeglad") return t("pod_przeglad");
  if (warstwa === "orto") return t("pod_orto").replace("{data}", m.ortofoto.data_zdjecia)
    .replace("{arkusz}", m.ortofoto.arkusz).replace("{uldk}", m.uldk.odczyt).replace("{sam}", m.sam.przebieg);
  if (warstwa === "ndvi") return t("pod_ndvi").replace("{data}", m.sentinel.data);
  return t("pod_ndre").replace("{data}", m.sentinel.data);
}

function pokazDzialke(){
  const d = daneDzialki();
  $("widok-brak").classList.remove("aktywny");
  $("widok-dzialki").style.display = "block";
  $("obraz").src = obrazek(d, stan.warstwa);
  $("obraz").alt = d.id + ", " + stan.warstwa;
  $("podpis").textContent = podpis(d, stan.warstwa);
  const s = d.stat, ter = d.teren;
  $("karty").innerHTML = `
    <div class="karta"><div class="nazwa">${t("k_ndvi")}</div><div class="wartosc">${fmt(s.ndvi_srednia,3)}</div>
      <div class="dopisek">${t("d_ci")}${fmt(s.ci95_ndvi,3)} · ${s.piksele_uzyte} ${t("d_px")}</div></div>

    <div class="karta"><div class="nazwa">${t("k_rzezba")}</div><div class="wartosc">${fmt(ter.h_min_m,1)}–${fmt(ter.h_max_m,1)} m</div>
      <div class="dopisek">${t("d_roznica").replace("%s", fmt(ter.roznica_m,1)).replace("%s", ter.n_danych)}</div></div>
    <div class="karta"><div class="nazwa">${t("k_brzeg")}</div><div class="wartosc">${fmt(s.piksele_brzegowe_pct,1)}%</div>
      <div class="dopisek">${t("d_brzeg")}</div></div>`;

  $("limity").innerHTML = tresc(d, "limity").map(x => `<li>${x}</li>`).join("");
  pokazOpis(d);
  pokazPorownanie(d);
}

function pokazOpis(d){
  $("prompt-info").textContent = promptOpis(d);
  const lokalny = d.opisy.lokalny || {}, meta = d.opisy.meta || {};
  let zrodlo, kluczTytulu, zapas = false, pokazanyModel = null;
  if (stan.model === "meta") {
    zrodlo = meta; kluczTytulu = "opis_meta";
  } else if (lokalny[stan.jezyk]) {
    zrodlo = lokalny; kluczTytulu = "opis_lokalny";
  } else if (meta[stan.jezyk]) {
    zrodlo = meta; kluczTytulu = "opis_meta_zapas"; zapas = true; pokazanyModel = "lokalny";
  } else {
    zrodlo = meta.brak ? meta : lokalny; kluczTytulu = "opis_brak";
  }
  $("tytul-opisu").textContent = t(kluczTytulu);
  if (zrodlo.brak) {
    const powod = (stan.jezyk === "en" && TRESCI_EN[d.id] && TRESCI_EN[d.id].brak)
      ? TRESCI_EN[d.id].brak : zrodlo.brak;
    $("opis").innerHTML = `<p class="ostrzezenie">${t("brak_opisu")}: ${powod}. ${t("wynik_zostaje")}</p>`;
    $("opis-meta").textContent = "";
  } else {
    const glowny = zrodlo[stan.jezyk];
    // Po angielsku tylko angielski: sędzia nie ma czytać polskiego bloku pod spodem.
    const drugi = stan.jezyk === "pl" ? zrodlo.en : null;
    $("opis").innerHTML = `<p>${glowny || t("brak_tekstu")}</p>` +
      (drugi ? `<div class="en">${drugi}</div>` : "");
    const cz = (zrodlo.czas_s !== null && zrodlo.czas_s !== undefined) ? `${fmt(zrodlo.czas_s,1)} s` : "?";
    $("opis-meta").textContent = `${t("meta_model")}: ${zrodlo.model || "?"} · ${t("meta_data")}: ${zrodlo.data || "?"} · ` +
      `${t("meta_czas")}: ${cz} · ${t("meta_koszt")}: ` +
      (zrodlo.koszt_usd === 0 ? t("meta_lokalnie") : fmt(zrodlo.koszt_usd,4)+" USD") +
      (zapas ? ` · ${t("zapas")} ${powodBraku(d, pokazanyModel)}.` : "");
  }
}

function pokazPorownanie(d){
  const l = d.opisy.lokalny || {}, m = d.opisy.meta || {};
  const ltok = l.usage ? `${l.usage.prompt_eval_count ?? "?"} / ${l.usage.eval_count ?? "?"}` : "—";
  const mt = m.usage || {};
  const mtok = m.usage ? `${mt.prompt_tokens ?? "?"} / ${mt.completion_tokens ?? "?"}` : "—";
  $("porownanie").innerHTML = `
    <tr><td>${t("por_model")}</td><td>${l.model || DANE.porownanie.lokalny.model}</td><td>${m.model || DANE.porownanie.meta.model}</td></tr>
    <tr><td>${t("por_czas")}</td><td class="liczba">${fmt(l.czas_s,1)} s</td><td class="liczba">${fmt(m.czas_s,1)} s</td></tr>

    <tr><td>${t("por_koszt")}</td><td class="liczba">0 USD</td><td class="liczba">${fmt(m.koszt_usd,4)} USD</td></tr>
    <tr><td>${t("por_gdzie")}</td><td>${t("por_gdzie_l")}</td><td>${t("por_gdzie_m")}</td></tr>

}
